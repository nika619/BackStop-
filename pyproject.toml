[project]
name = "backstop"
version = "2.0.0"
description = "Deterministic Policy-Gated AI Revenue Recovery Engine for Razorpay Failed Payments"
authors = [
    { name = "nika619", email = "brahmanmayank00@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F841", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["backstop"]
omit = [
    "backstop/api.py",
    "backstop/database.py",
    "backstop/eval/*",
    "backstop/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
